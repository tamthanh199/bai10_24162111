<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        .wrap {
            max-width: 1050px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        #reloadButton {
            background: #2563eb;
            color: #fff;
        }

        #logoutButton {
            background: #dc2626;
            color: #fff;
        }

        button:hover {
            opacity: 0.9;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e5e7eb;
            background: #f3f4f6;
        }

        .profile-text h2 {
            margin: 0 0 12px;
        }

        .profile-text p {
            margin: 6px 0;
            color: #444;
        }

        .label {
            font-weight: 700;
            color: #111;
        }

        pre {
            overflow-x: auto;
            background: #f0f2f5;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        h1 {
            margin-top: 0;
        }

        @media (max-width: 600px) {
            .profile-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>

    <script src="/js/main.js" defer></script>
</head>

<body>

    <div class="wrap" id="profilePage">

        <h1>JWT Nimbus - Protected API</h1>

        <div class="toolbar">
            <button id="reloadButton" type="button">
                Gọi lại API
            </button>

            <button id="logoutButton" type="button">
                Đăng xuất
            </button>
        </div>

        <!-- Thông tin người dùng -->
        <section class="card">

            <div class="profile-info">

                <img
                    id="profileImage"
                    class="avatar"
                    src="/images/default-avatar.png"
                    alt="Avatar">

                <div class="profile-text">

                    <h2 id="profileFullName">
                        Đang tải...
                    </h2>

                    <p>
                        <span class="label">Email:</span>
                        <span id="profileEmail"></span>
                    </p>

                    <p>
                        <span class="label">Role:</span>
                        <span id="profileRole"></span>
                    </p>

                </div>

            </div>

        </section>

        <!-- API lấy user đang đăng nhập -->
        <section class="card">

            <h2>GET /users/me</h2>

            <pre id="meOutput">Đang tải...</pre>

        </section>

        <!-- API lấy danh sách user -->
        <section class="card">

            <h2>GET /users</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">
                </tbody>

            </table>

        </section>

    </div>

</body>

</html>
