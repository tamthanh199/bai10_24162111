<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - JWT Nimbus Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }
        .wrap {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,.06);
        }
        h1 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 700;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 8px;
        }
        button {
            margin-top: 18px;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .msg {
            margin-top: 14px;
            min-height: 22px;
            white-space: pre-wrap;
        }
        code {
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 5px;
        }
        @media (max-width: 720px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="/js/main.js" defer></script>
</head>
<body>
<div class="wrap">
    <div class="grid">
        <section class="card">
            <h2>Đăng ký</h2>
            <form id="signupForm">
                <label for="fullName">Họ tên</label>
                <input id="fullName" name="fullName" required placeholder="Nhập họ tên">

                <label for="signupEmail">Email</label>
                <input id="signupEmail" name="email" type="email" required placeholder="Nhập email">

                <label for="signupPassword">Mật khẩu</label>
                <input id="signupPassword" name="password" type="password" required minlength="6">

                <button type="submit">Tạo tài khoản</button>
                <div id="signupMessage" class="msg"></div>
            </form>
        </section>

        <section class="card">
            <h2>Đăng nhập</h2>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" required placeholder="Nhập email">

                <label for="loginPassword">Mật khẩu</label>
                <input id="loginPassword" name="password" type="password" required>

                <button type="submit">Đăng nhập và lấy JWT</button>
                <div id="loginMessage" class="msg"></div>
            </form>
        </section>
    </div>
</div>
</body>
</html>
